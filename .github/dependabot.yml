version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nest-core:
        patterns:
          - "@nestjs/common"
          - "@nestjs/core"
          - "@nestjs/platform-fastify"
      prisma:
        patterns:
          - prisma
          - "@prisma/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
