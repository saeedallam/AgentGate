name: Backend verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agentgate
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: agentgate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentgate -d agentgate_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://agentgate:ci-test-only@localhost:5432/agentgate_test
      TEST_DATABASE_URL: postgresql://agentgate:ci-test-only@localhost:5432/agentgate_test
      JWT_ACCESS_SECRET: ci-only-not-a-production-secret-0123456789abcdef
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run lint
      - name: Database integrity and independent connection races
        run: >-
          node --test --test-concurrency=1
          test/actions-http.integration.cjs
          test/execution-model.integration.cjs
          test/policy-persistence.integration.cjs
          test/approval-model.integration.cjs
          test/approval-binding.integration.cjs
          test/execution-immutability.integration.cjs
          test/approvals-http.integration.cjs
          test/approved-execution.integration.cjs
          test/approval-concurrency.integration.cjs
          test/policy-tightening.integration.cjs
          test/execution-recovery.integration.cjs
          test/recovery-concurrency.integration.cjs
          test/refund-budget.integration.cjs
          test/refund-budget-concurrency.integration.cjs
          test/observations.integration.cjs
          test/mcp-flow.integration.cjs
          test/console-monitoring.integration.cjs
          test/operational-controls.integration.cjs
          test/rate-concurrency.integration.cjs
          test/control-claim-concurrency.integration.cjs
      - name: Verify Docker packaging
        run: docker build --tag agentgate:ci .
